[project]
name = "clasificador-obesidad"
version = "0.1.0"
description = "Desktop app that serves the winning obesity-level classifier (XGBoost + P2 habits preprocessing)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# scikit-learn and xgboost are pinned to the versions printed by Notebook_Matriz.ipynb
# (cell 3: "scikit-learn 1.6.1 | xgboost 3.4.1"), the session that pickled modelos/modelo_ganador.pkl.
dependencies = [
    "customtkinter>=5.2.2",
    "joblib>=1.4",
    "numpy>=2.1",
    "pandas>=2.2.3",
    "scikit-learn==1.6.1",
    "xgboost==3.4.1",
]

[project.scripts]
app = "app_obesidad.app:main"

[dependency-groups]
dev = ["pytest>=8"]
# Only for scripts/evaluar_app.py (downloads the UCI dataset and plots the confusion matrix).
eval = ["ucimlrepo>=0.0.7", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src` must stay importable as `src.p2_habitos`: the pickled pipeline references that path.
packages = ["app_obesidad", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
